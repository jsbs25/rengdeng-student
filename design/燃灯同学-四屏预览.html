<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0f0f">
<title>燃灯同学 · 四屏设计预览（原生版）</title>
<style>
:root{
  --bg:#0f0f0f; --bg-2:#161818; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.10);
  --t1:#f2f1ed; --t2:#a9b0ac; --t3:#6f7772;
  --gold:#c9a84c; --gold-soft:rgba(201,168,76,.18); --gold-line:rgba(231,209,140,.45);
  --emerald:#1f6b54; --emerald-2:#2e8f6e;
  --r-s:10px; --r-m:14px; --r-l:20px; --r-xl:26px;
  --ease:cubic-bezier(.16,1,.3,1);
  --font:-apple-system,BlinkMacSystemFont,'Inter','SF Pro Text','PingFang SC','Microsoft YaHei',sans-serif;
  --ar:'Amiri','DubaiNur','Scheherazade New','Noto Naskh Arabic',serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font); background:
    radial-gradient(1200px 600px at 50% -10%, rgba(201,168,76,.10), transparent 60%),
    radial-gradient(900px 500px at 80% 110%, rgba(31,107,84,.14), transparent 60%),
    var(--bg);
  color:var(--t1); min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:40px 20px; -webkit-font-smoothing:antialiased;
}
/* 桌面展示台 */
.stage{ display:flex; gap:44px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }
.phone{
  width:390px; height:800px; border-radius:44px; position:relative; overflow:hidden;
  background:linear-gradient(180deg,#0f1111,#0b0d0d);
  border:1px solid rgba(255,255,255,.10);
  box-shadow:0 40px 90px rgba(0,0,0,.6), 0 0 0 10px rgba(255,255,255,.03), inset 0 1px 0 rgba(255,255,255,.06);
  display:flex; flex-direction:column;
}
.notch{ position:absolute; top:10px; left:50%; transform:translateX(-50%); width:120px; height:26px;
  background:#000; border-radius:999px; z-index:60; }
.screen{ flex:1; overflow-y:auto; padding:54px 22px 108px; position:relative; }
.screen::-webkit-scrollbar{ width:0 }
/* 顶栏 */
.topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:22px; }
.brand{ font-size:19px; font-weight:700; letter-spacing:-.02em; }
.brand small{ display:block; font-size:10.5px; color:var(--t3); font-weight:500; letter-spacing:.10em; margin-top:3px; text-transform:uppercase; }
.avatar{ width:36px;height:36px;border-radius:999px; border:1px solid var(--line);
  background:linear-gradient(145deg,#e6d391,#8a6f27); }
/* AI 光球 */
.orb{ width:132px;height:132px;border-radius:999px; margin:6px auto 26px; position:relative;
  background:radial-gradient(circle at 32% 25%, #fff0bd, #b59247 25%, #136b54 60%, #0d1713 82%);
  box-shadow:0 0 70px rgba(201,168,76,.28), inset 0 0 40px rgba(0,0,0,.35);
  animation:float 6s var(--ease) infinite; }
.orb::after{ content:''; position:absolute; inset:-14px; border-radius:999px;
  border:1px solid rgba(201,168,76,.16); animation:pulse 4s ease-in-out infinite; }
@keyframes float{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
@keyframes pulse{ 0%,100%{opacity:.35;transform:scale(1)} 50%{opacity:.75;transform:scale(1.05)} }
/* 玻璃卡 */
.glass{ background:var(--panel); border:1px solid var(--line); border-radius:var(--r-l);
  backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06); }
/* 每日一句 */
.quote{ padding:26px 22px; text-align:center; margin-bottom:16px; }
.quote .ar{ font-family:var(--ar); font-size:31px; line-height:1.95; color:var(--gold);
  direction:rtl; word-spacing:.05em; margin-bottom:14px;
  text-shadow:0 2px 18px rgba(201,168,76,.22); }
.quote .cn{ font-size:14.5px; color:var(--t2); letter-spacing:.01em; line-height:1.7; }
.quote .lbl{ margin-top:16px; font-size:10px; letter-spacing:.18em; color:var(--t3); text-transform:uppercase; }
/* 进度卡 */
.prog{ padding:18px 20px; margin-bottom:16px; }
.prog .row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.prog .t{ font-size:13px; color:var(--t2); }
.prog .p{ font-size:15px; font-weight:700; color:var(--gold); }
.bar{ height:6px; border-radius:999px; background:rgba(255,255,255,.07); overflow:hidden; }
.bar i{ display:block; height:100%; width:85%; border-radius:999px;
  background:linear-gradient(90deg,var(--emerald-2),var(--gold)); }
.prog .sub{ margin-top:10px; font-size:11.5px; color:var(--t3); }
/* 大搜索框 */
.bigsearch{ display:flex; align-items:center; gap:10px; padding:15px 18px; margin-bottom:22px; }
.bigsearch input{ flex:1; background:none; border:0; outline:0; color:var(--t1); font-size:15.5px; font-family:var(--font); }
.bigsearch input::placeholder{ color:var(--t3); }
.bigsearch .ic{ color:var(--gold); font-size:17px; }
/* 区块标题 */
.sec{ font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--t3); margin:24px 0 12px; }
/* 书 */
.books{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.book{ border-radius:var(--r-m); overflow:hidden; position:relative; aspect-ratio:.68;
  border:1px solid rgba(231,209,140,.22); box-shadow:0 14px 30px rgba(0,0,0,.45); }
.book::after{ content:''; position:absolute; inset:0;
  background:linear-gradient(105deg, rgba(255,255,255,.14) 0%, transparent 34%, transparent 62%, rgba(0,0,0,.32) 100%); }
.book .in{ position:absolute; inset:0; padding:16px 14px; display:flex; flex-direction:column; justify-content:space-between; }
.book .ttl{ font-size:14px; font-weight:700; color:#fff6dd; text-shadow:0 1px 10px rgba(0,0,0,.6); }
.book .en{ font-size:8.5px; letter-spacing:.16em; color:rgba(255,246,221,.62); text-transform:uppercase; }
.b1{ background:linear-gradient(145deg,#b9a46a,#5a4520 56%,#1b201b) }
.b2{ background:linear-gradient(145deg,#5a8970,#214f3b 58%,#17221a) }
.b3{ background:linear-gradient(145deg,#7990a0,#354657 58%,#192128) }
.b4{ background:linear-gradient(145deg,#a06c43,#5a3521 58%,#231b15) }
/* 分类条 */
.cats{ display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
.cats::-webkit-scrollbar{ display:none }
.cat{ flex:0 0 auto; padding:9px 16px; border-radius:999px; font-size:12.5px; color:var(--t2);
  border:1px solid var(--line); background:rgba(255,255,255,.03); cursor:pointer; white-space:nowrap; }
.cat.on{ background:var(--gold); color:#17170f; border-color:var(--gold); font-weight:650; }
/* 工具行 */
.tool{ display:flex; align-items:center; gap:13px; padding:15px 17px; margin-bottom:10px; cursor:pointer; }
.tool .ti{ width:38px;height:38px;border-radius:11px; display:flex;align-items:center;justify-content:center;
  background:var(--gold-soft); color:var(--gold); font-size:17px; flex:0 0 auto; }
.tool .tn{ font-size:14.5px; font-weight:600; }
.tool .td{ font-size:11.5px; color:var(--t3); margin-top:2px; }
.tool .ar{ margin-left:auto; color:var(--t3); }
/* 聊天 */
.chat{ display:flex; flex-direction:column; gap:12px; }
.msg{ max-width:84%; padding:12px 15px; border-radius:16px; font-size:14px; line-height:1.65; }
.msg.ai{ background:rgba(255,255,255,.055); border:1px solid var(--line); color:var(--t1); border-bottom-left-radius:5px; }
.msg.me{ margin-left:auto; background:linear-gradient(135deg,var(--emerald-2),var(--emerald)); color:#eafff5;
  border-bottom-right-radius:5px; font-weight:500; }
/* 大麦克风 */
.mic{ width:112px;height:112px;border-radius:999px; margin:24px auto 12px; display:flex;align-items:center;justify-content:center;
  font-size:42px; cursor:pointer;
  background:radial-gradient(circle at 35% 30%, #ffe9a8, #c9a84c 40%, #8a6f27 100%);
  box-shadow:0 0 60px rgba(201,168,76,.35), inset 0 -6px 20px rgba(0,0,0,.25);
  animation:pulse2 3.4s var(--ease) infinite; }
@keyframes pulse2{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }
.mictip{ text-align:center; font-size:12.5px; color:var(--t3); }
/* 浏览足迹 */
.fp{ display:flex; align-items:center; gap:12px; padding:13px 15px; border-bottom:1px solid var(--line); font-size:13px; }
.fp:last-child{ border-bottom:0 }
.fp .dot{ width:7px;height:7px;border-radius:999px;background:var(--gold); flex:0 0 auto; }
.fp .tm{ margin-left:auto; font-size:11px; color:var(--t3); }
/* 底部导航（玻璃） */
.nav{ position:absolute; left:14px; right:14px; bottom:14px; z-index:50;
  display:grid; grid-template-columns:repeat(4,1fr); gap:2px; padding:9px 6px calc(9px + env(safe-area-inset-bottom));
  border-radius:22px; border:1px solid var(--line);
  background:rgba(25,28,28,.90); backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%); box-shadow:0 18px 40px rgba(0,0,0,.55); }
.nav button{ background:none;border:0;color:var(--t3);cursor:pointer;font-family:var(--font);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:5px 0;border-radius:14px;transition:.18s var(--ease); }
.nav button .i{ font-size:17px; line-height:1 }
.nav button .l{ font-size:9.5px; letter-spacing:.02em }
.nav button.on{ color:var(--gold); background:rgba(201,168,76,.10) }
.screen{ display:none }
.screen.on{ display:block }
.cap{ text-align:center; font-size:11px; color:var(--t3); letter-spacing:.16em; text-transform:uppercase; margin-bottom:12px }

@media (max-width:900px){
  body{padding:16px 8px; align-items:flex-start}
  .stage{gap:24px}
  .phone{ width:340px; height:700px; border-radius:38px; transform:scale(.92); transform-origin:top center }
  .screen{ padding:48px 18px 100px }
}
@media (max-width:420px){
  .phone{ width:100%; max-width:360px; height:auto; min-height:660px; transform:none }
}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
/* ===== 四屏数据（演示内容 ✓ 无出处标注 ✓）===== */
var TABS = [['home','首页','⌂'],['library','世界图书馆','▤'],['search','搜索','⌕'],['nora','诺尔老师','◉']];
var BOOKS = [
  ['b1','古典名著选编','CLASSICAL TEXTS'],
  ['b2','世界文学经典','WORLD LITERATURE'],
  ['b3','基础语法入门','BASIC GRAMMAR'],
  ['b4','阿拉伯故事集','FOLKTALES']
];
var CATS = ['哲学','历史','文学','语言'];
var TOOLS = [
  ['⌕','查单词','阿语 → 中文 · 词根 · 近反义 · 例句'],
  ['≡','句子分析','拆解语法 · 成分 · 时态'],
  ['⇄','全文翻译','中 ↔ 阿 长文互译']
];
var FOOTPRINTS = [
  ['古典名著选编 · 第三章','2 分钟前'],
  ['基础语法入门 · 名词与格','今天 14:20'],
  ['世界文学经典 · 序言','昨天']
];

/* ===== 屏幕渲染 ===== */
function sHome(){
  return '<div class="topbar"><div class="brand">燃灯同学<small>Randeng · Arabic</small></div><div class="avatar"></div></div>'
  + '<div class="orb"></div>'
  + '<div class="glass quote">'
  +   '<div class="ar">العِلْمُ كَنْزٌ لَا يَفْنَىٰ</div>'
  +   '<div class="cn">知识是永不消逝的宝藏</div>'
  +   '<div class="lbl">每日一句</div>'
  + '</div>'
  + '<div class="glass prog">'
  +   '<div class="row"><div class="t">学习进度</div><div class="p">85%</div></div>'
  +   '<div class="bar"><i></i></div>'
  +   '<div class="sub">Module 5 · Calligraphy Masters 书法进阶</div>'
  + '</div>';
}
function sLibrary(){
  var b = BOOKS.map(function(x){
    return '<div class="book '+x[0]+'"><div class="in"><div class="en">'+x[2]+'</div><div class="ttl">'+x[1]+'</div></div></div>';
  }).join('');
  var c = CATS.map(function(x,i){ return '<div class="cat'+(i===0?' on':'')+'">'+x+'</div>'; }).join('');
  return '<div class="topbar"><div class="brand">世界图书馆<small>World Library</small></div><div class="avatar"></div></div>'
  + '<div class="cats">'+c+'</div>'
  + '<div class="sec">精选书目</div>'
  + '<div class="books">'+b+'</div>';
}
function sSearch(){
  var t = TOOLS.map(function(x){
    return '<div class="glass tool"><div class="ti">'+x[0]+'</div><div><div class="tn">'+x[1]+'</div><div class="td">'+x[2]+'</div></div><div class="ar">›</div></div>';
  }).join('');
  return '<div class="topbar"><div class="brand">查单词 &amp; 句子查询<small>Search</small></div><div class="avatar"></div></div>'
  + '<div class="glass bigsearch"><span class="ic">⌕</span><input placeholder="输入阿语单词或中文… （كتاب / 书）"></div>'
  + '<div class="sec">工具</div>' + t
  + '<div class="sec">最近查询</div>'
  + '<div class="glass" style="padding:4px 0"><div class="fp"><span class="dot"></span>كِتَاب　书<div class="tm">刚刚</div></div>'
  + '<div class="fp"><span class="dot"></span>مَدْرَسَة　学校<div class="tm">今天</div></div></div>';
}
function sNora(){
  var fp = FOOTPRINTS.map(function(x){
    return '<div class="fp"><span class="dot"></span>'+x[0]+'<div class="tm">'+x[1]+'</div></div>';
  }).join('');
  var t = TOOLS.map(function(x){
    return '<div class="glass tool"><div class="ti">'+x[0]+'</div><div><div class="tn">'+x[1]+'</div><div class="td">'+x[2]+'</div></div></div>';
  }).join('');
  return '<div class="topbar"><div class="brand">诺尔老师<small>Nora AI · DeepSeek</small></div><div class="avatar"></div></div>'
  + '<div class="chat">'
  +   '<div class="msg me">诺尔老师，我想练习超市买东西。</div>'
  +   '<div class="msg ai">你好，我是诺尔老师。很高兴能实时对话——只需说话或打字即可，我来陪你练习。</div>'
  + '</div>'
  + '<div class="mic">🎙</div>'
  + '<div class="mictip">点击说话练习口语</div>'
  + '<div class="sec">快捷工具</div>' + t
  + '<div class="sec">浏览足迹</div>'
  + '<div class="glass" style="padding:4px 0;margin-bottom:16px">'+fp+'</div>';
}

/* ===== 组装 4 台手机 ===== */
function render(){
  var html = '';
  TABS.forEach(function(tab, idx){
    var body = [sHome, sLibrary, sSearch, sNora][idx]();
    var nav = TABS.map(function(t,i){
      return '<button class="'+(i===idx?'on':'')+'" onclick="go('+idx+','+i+')"><span class="i">'+t[2]+'</span><span class="l">'+t[1]+'</span></button>';
    }).join('');
    html += '<div><div class="cap">'+tab[1]+'</div><div class="phone" id="ph'+idx+'">'
         +  '<div class="notch"></div>'
         +  '<div class="screen on" id="sc'+idx+'">'+body+'</div>'
         +  '<div class="nav">'+nav+'</div>'
         +  '</div></div>';
  });
  document.getElementById('stage').innerHTML = html;
}
/* 单机内切换（预览用 ✓）*/
function go(phone, screenIdx){
  var ph = document.getElementById('ph'+phone);
  if(!ph) return;
  ph.querySelector('.screen').innerHTML = [sHome,sLibrary,sSearch,sNora][screenIdx]();
  ph.querySelectorAll('.nav button').forEach(function(b,i){ b.classList.toggle('on', i===screenIdx); });
}
render();
</script>
</body>
</html>
