server {
    listen 80;
    server_name your-domain.com;

    client_max_body_size 64m;         # ASR 上传音频用
    gzip on;
    gzip_types text/html application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_buffering off;          # 大文件/流式返回更稳
    }

    # 简单限流：AI 接口每分钟 30 次
    limit_req_zone $binary_remote_addr zone=ai:10m rate=30r/m;
    location /api/chat/ {
        limit_req zone=ai burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
    }
}
